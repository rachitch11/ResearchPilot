openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI provider operations
  - name: research
    description: Research planning operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: healthCheckAlias
      tags: [health]
      summary: Health check alias
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/status:
    get:
      operationId: getAiProviderStatus
      tags: [ai]
      summary: AI provider status
      description: Returns provider configuration status without exposing credentials
      responses:
        "200":
          description: AI provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderStatus"
  /ai/test:
    post:
      operationId: testAiProvider
      tags: [ai]
      summary: Test AI provider
      description: Generates a bounded response from the configured AI provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiTestInput"
      responses:
        "200":
          description: Generated response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /research/plan:
    post:
      operationId: createResearchPlan
      tags: [research]
      summary: Create a research plan
      description: Decomposes a question into bounded sub-questions and search intents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchPlanInput"
      responses:
        "200":
          description: Structured research plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchPlan"
        "400":
          description: Invalid research question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Planner provider failure or invalid model output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiProviderStatus:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        configured:
          type: boolean
      required:
        - provider
        - model
        - configured
    AiTestInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - prompt
    AiTestResponse:
      type: object
      properties:
        text:
          type: string
        provider:
          type: string
        model:
          type: string
      required:
        - text
        - provider
        - model
    ResearchPlanInput:
      type: object
      properties:
        question:
          type: string
          minLength: 5
          maxLength: 2000
      required:
        - question
    ResearchPlan:
      type: object
      properties:
        question:
          type: string
        objective:
          type: string
          minLength: 1
        subQuestions:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: "#/components/schemas/ResearchSubQuestion"
        searchQueries:
          type: array
          minItems: 3
          maxItems: 8
          items:
            $ref: "#/components/schemas/ResearchSearchQuery"
        constraints:
          type: array
          maxItems: 8
          items:
            type: string
        assumptions:
          type: array
          maxItems: 8
          items:
            type: string
        provider:
          type: string
        model:
          type: string
      required:
        - question
        - objective
        - subQuestions
        - searchQueries
        - constraints
        - assumptions
        - provider
        - model
    ResearchSubQuestion:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        question:
          type: string
          minLength: 1
        rationale:
          type: string
          minLength: 1
      required:
        - id
        - question
        - rationale
    ResearchSearchQuery:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        purpose:
          type: string
          minLength: 1
      required:
        - query
        - purpose
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        requestId:
          type: string
      required:
        - error

