openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI provider operations
  - name: research
    description: Research planning operations
  - name: search
    description: Web search operations
  - name: webpage
    description: Webpage extraction operations
  - name: sources
    description: Source classification operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: healthCheckAlias
      tags: [health]
      summary: Health check alias
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/status:
    get:
      operationId: getAiProviderStatus
      tags: [ai]
      summary: AI provider status
      description: Returns provider configuration status without exposing credentials
      responses:
        "200":
          description: AI provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderStatus"
  /ai/test:
    post:
      operationId: testAiProvider
      tags: [ai]
      summary: Test AI provider
      description: Generates a bounded response from the configured AI provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiTestInput"
      responses:
        "200":
          description: Generated response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /research/plan:
    post:
      operationId: createResearchPlan
      tags: [research]
      summary: Create a research plan
      description: Decomposes a question into bounded sub-questions and search intents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchPlanInput"
      responses:
        "200":
          description: Structured research plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchPlan"
        "400":
          description: Invalid research question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Planner provider failure or invalid model output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /search:
    post:
      operationId: searchWeb
      tags: [search]
      summary: Search the web
      description: Runs bounded search intents and returns normalized, deduplicated results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Normalized search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Invalid search request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Search provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Search provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /webpage/read:
    post:
      operationId: readWebpage
      tags: [webpage]
      summary: Read a webpage
      description: Retrieves a bounded public HTML page and extracts readable text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadWebpageRequest"
      responses:
        "200":
          description: Extracted webpage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebpageDocument"
        "400":
          description: Invalid webpage URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Webpage exceeds configured size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Webpage does not contain readable text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Webpage retrieval failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sources/classify:
    post:
      operationId: classifySources
      tags: [sources]
      summary: Classify sources
      description: Assigns heuristic source types and quality estimates from source domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifySourcesRequest"
      responses:
        "200":
          description: Classified sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifiedSourceCollection"
        "400":
          description: Invalid source input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiProviderStatus:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        configured:
          type: boolean
      required:
        - provider
        - model
        - configured
    AiTestInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - prompt
    AiTestResponse:
      type: object
      properties:
        text:
          type: string
        provider:
          type: string
        model:
          type: string
      required:
        - text
        - provider
        - model
    ResearchPlanInput:
      type: object
      properties:
        question:
          type: string
          minLength: 5
          maxLength: 2000
      required:
        - question
    ResearchPlan:
      type: object
      properties:
        question:
          type: string
        objective:
          type: string
          minLength: 1
        subQuestions:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: "#/components/schemas/ResearchSubQuestion"
        searchQueries:
          type: array
          minItems: 3
          maxItems: 8
          items:
            $ref: "#/components/schemas/ResearchSearchQuery"
        constraints:
          type: array
          maxItems: 8
          items:
            type: string
        assumptions:
          type: array
          maxItems: 8
          items:
            type: string
        provider:
          type: string
        model:
          type: string
      required:
        - question
        - objective
        - subQuestions
        - searchQueries
        - constraints
        - assumptions
        - provider
        - model
    ResearchSubQuestion:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        question:
          type: string
          minLength: 1
        rationale:
          type: string
          minLength: 1
      required:
        - id
        - question
        - rationale
    ResearchSearchQuery:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        purpose:
          type: string
          minLength: 1
      required:
        - query
        - purpose
    SearchRequest:
      type: object
      properties:
        queries:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/SearchIntent"
        maxResults:
          type: number
          minimum: 1
          maximum: 20
          default: 5
      required:
        - queries
    SearchIntent:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
        purpose:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - query
    SearchResponse:
      type: object
      properties:
        provider:
          type: string
        queries:
          type: array
          items:
            $ref: "#/components/schemas/SearchIntent"
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        totalResults:
          type: number
          minimum: 0
        deduplicatedResults:
          type: number
          minimum: 0
      required:
        - provider
        - queries
        - results
        - totalResults
        - deduplicatedResults
    SearchResult:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        snippet:
          type: string
        publishedDate:
          type: string
        domain:
          type: string
        sourceQuery:
          type: string
        purpose:
          type: string
      required:
        - title
        - url
        - snippet
        - domain
        - sourceQuery
    ReadWebpageRequest:
      type: object
      properties:
        url:
          type: string
          minLength: 8
          maxLength: 2048
      required:
        - url
    WebpageDocument:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        domain:
          type: string
        publicationDate:
          type: string
        cleanText:
          type: string
      required:
        - title
        - url
        - domain
        - cleanText
    ClassifySourcesRequest:
      type: object
      properties:
        sources:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/SourceInput"
      required:
        - sources
    SourceInput:
      type: object
      properties:
        url:
          type: string
          minLength: 8
          maxLength: 2048
        title:
          type: string
          maxLength: 500
      required:
        - url
    ClassifiedSourceCollection:
      type: object
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceClassification"
      required:
        - sources
    SourceClassification:
      type: object
      properties:
        url:
          type: string
        domain:
          type: string
        title:
          type: string
        sourceType:
          type: string
        quality:
          type: string
        signals:
          type: array
          items:
            type: string
      required:
        - url
        - domain
        - sourceType
        - quality
        - signals
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        requestId:
          type: string
      required:
        - error

